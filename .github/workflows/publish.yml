name: 📦 Build & Publish

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "deno.jsonc"
      - ".jsr.json"
      - "scripts/**"
      - ".github/workflows/publish.yml"
      - ".releaserc.json"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "deno.jsonc"
      - ".jsr.json"
      - "scripts/**"
      - ".github/workflows/publish.yml"
      - ".releaserc.json"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and build only'
        required: false
        default: false
        type: boolean
      force_release:
        description: 'Force semantic release even if no changes'
        required: false
        default: false
        type: boolean

env:
  FORCE_COLOR: 1

jobs:
  # Build and test job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for semantic-release

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🔍 Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: 🔧 Install dependencies
        run: deno install --allow-scripts

      - name: 📋 Run tests
        if: inputs.skip_tests != true
        run: deno task test

      - name: 📊 Generate coverage report
        run: deno task coverage

      - name: 🏗️ Build NPM package
        run: deno task build

      - name: 📚 Generate documentation
        run: deno task doc

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm/
          retention-days: 7

      - name: 📑 Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/
          retention-days: 7

  # Semantic Release job (only for push to main/master)
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release_info.outputs.release_created }}
      new_version: ${{ steps.release_info.outputs.new_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # For JSR OIDC authentication
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for semantic-release
          token: ${{ secrets.GH_TOKEN }}

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: 🔧 Install Semantic Release
        run: |
          npm install -g semantic-release
          npm install -g @semantic-release/changelog
          npm install -g @semantic-release/exec
          npm install -g @semantic-release/git
          npm install -g @semantic-release/github
          npm install -g conventional-changelog-conventionalcommits

      - name: 🔧 Install Deno dependencies
        run: deno install --allow-scripts

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm/

      - name: 🚀 Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📖 Get release info
        id: release_info
        run: |
          # Check if semantic-release created a new tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ ! -z "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")" ]; then
            echo "new_version=${LATEST_TAG#v}" >> $GITHUB_OUTPUT
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "✅ New release created: $LATEST_TAG"
          else
            echo "release_created=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No new release created"
          fi

  # Publish to both JSR and NPM (after semantic release)
  publish:
    if: needs.release.outputs.release_created == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC ID token for JSR authentication
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # Use updated version from semantic-release
          token: ${{ secrets.GH_TOKEN }}

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: 🔧 Install dependencies
        run: deno install --allow-scripts

      - name: 🚀 Publish to JSR
        run: deno task jsr

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm/

      - name: 🚀 Publish to NPM
        run: deno task npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
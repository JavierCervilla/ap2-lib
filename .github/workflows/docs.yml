name: 📚 Documentation

on:
  push:
    branches: [main, development]
    paths:
      - "src/**"
      - "deno.jsonc"
      - ".github/workflows/docs.yml"
      - "README.md"
  pull_request:
    branches: [main, development]
    paths:
      - "src/**"
      - "deno.jsonc"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: 🔍 Cache Deno dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: 🔧 Install dependencies
        run: deno install --allow-scripts

      - name: 📋 Run tests (ensure code quality)
        run: deno task test

      - name: 📚 Generate documentation
        run: deno task doc


      - name: 📦 Setup Pages
        uses: actions/configure-pages@v4

      - name: 🏗️ Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  # Deployment job (commented out - requires public repo or GitHub Enterprise)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on main/master branch
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

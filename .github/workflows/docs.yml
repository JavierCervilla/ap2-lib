name: 📚 Documentation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'deno.jsonc'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'deno.jsonc'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: 🔍 Cache Deno dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: 🔧 Install dependencies
        run: deno install --allow-scripts

      - name: 📋 Run tests (ensure code quality)
        run: deno task test

      - name: 📚 Generate documentation
        run: deno task doc

      - name: 📄 Create docs index redirect
        run: |
          echo '<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./mod.html">
            <title>AP2 Library Documentation</title>
          </head>
          <body>
            <p>Redirecting to <a href="./mod.html">AP2 Library Documentation</a>...</p>
          </body>
          </html>' > docs/index.html

      #- name: 📦 Setup Pages
      #  uses: actions/configure-pages@v4

      #- name: 🏗️ Upload artifact
      #  uses: actions/upload-pages-artifact@v3
      #  with:
      #    path: './docs'

